<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Activity overview for the last year: 90 percent commits, 10 percent pull requests, 0 percent issues, 0 percent code reviews">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <rect x="0.5" y="0.5" width="999" height="319" rx="10" fill="#0d1117" stroke="#30363d"/>

  <!-- header -->
  <circle cx="24" cy="22" r="5" fill="#ff5f56"/><circle cx="42" cy="22" r="5" fill="#ffbd2e"/><circle cx="60" cy="22" r="5" fill="#27c93f"/>
  <text x="82" y="26" font-size="12" fill="#6e7681" class="mono">mohammed@dhaka: ~/activity</text>

  <!-- left: numbers (updated automatically every day) -->
  <text x="48" y="104" font-size="15" fill="#3fb950" class="mono">$ activity --last-year</text>
  <g font-size="15" class="mono" fill="#c9d1d9">
    <text x="48" y="144">commits</text><text x="228" y="144" text-anchor="end" fill="#7ee787">106</text>
    <text x="48" y="172">pull requests</text><text x="228" y="172" text-anchor="end" fill="#7ee787">12</text>
    <text x="48" y="200">issues</text><text x="228" y="200" text-anchor="end" fill="#7ee787">0</text>
    <text x="48" y="228">code review</text><text x="228" y="228" text-anchor="end" fill="#7ee787">0</text>
  </g>

  <!-- chart -->
  <g transform="translate(560,168)">
    <!-- axes -->
    <g stroke="#3fb950" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-95" x2="0" y2="95"/>
      <line x1="-95" y1="0" x2="95" y2="0"/>
    </g>
    <!-- guide ring -->
    <path d="M0,-95 L95,0 L0,95 L-95,0 Z" fill="none" stroke="#30363d" stroke-dasharray="3 6" stroke-width="2"/>

    <!-- data shape grows in once -->
    <g>
      <animateTransform attributeName="transform" type="scale" from="0" to="1" dur="1.4s" begin="0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      <polygon points="-85.3,0 0,0 0,0 0,9.7" fill="#3fb950" fill-opacity="0.35" stroke="#3fb950" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="-85.3" cy="0.0" r="4.5" fill="#0d1117" stroke="#7ee787" stroke-width="2"/>
      <circle cx="0.0" cy="9.7" r="4.5" fill="#0d1117" stroke="#7ee787" stroke-width="2"/>
    </g>

    <!-- labels -->
    <g font-size="13" class="mono" fill="#8b949e">
      <text x="0" y="-108" text-anchor="middle">Code review</text>
      <text x="108" y="5">Issues</text>
      <text x="-108" y="-4" text-anchor="end" fill="#c9d1d9">90%</text>
      <text x="-108" y="14" text-anchor="end">Commits</text>
      <text x="0" y="116" text-anchor="middle" fill="#c9d1d9">10%</text>
      <text x="0" y="134" text-anchor="middle">Pull requests</text>
    </g>
  </g>
</svg>
