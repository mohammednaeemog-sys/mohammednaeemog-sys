name: Update profile stats

# Redraws the stats, languages and activity cards and refreshes the
# project list in README.md. Runs every day and whenever you start it
# by hand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/update-profile.yml]

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build cards and README sections
        env:
          # Optional: add a personal token as the PROFILE_TOKEN secret to also
          # count private contributions. Without it, public activity is used.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git commit -m "Update profile stats"
          git push
